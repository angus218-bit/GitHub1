name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Detect language/runtime
        id: detect
        run: |
          if [ -f "package.json" ]; then echo "type=node" >> $GITHUB_OUTPUT; fi
          if [ -f "requirements.txt" ] || [ -f "setup.py" ] || [ -f "pyproject.toml" ]; then echo "type=python" >> $GITHUB_OUTPUT; fi
          if [ -f "go.mod" ]; then echo "type=go" >> $GITHUB_OUTPUT; fi

      # Node.js
      - uses: actions/setup-node@v4
        if: steps.detect.outputs.type == 'node'
        with:
          node-version: "18"
      - run: npm ci
        if: steps.detect.outputs.type == 'node'
      - run: npm run lint --if-present
        if: steps.detect.outputs.type == 'node'
      - run: npm test --if-present
        if: steps.detect.outputs.type == 'node'

      # Python
      - uses: actions/setup-python@v4
        if: steps.detect.outputs.type == 'python'
        with:
          python-version: "3.11"
      - run: pip install -r requirements.txt -e .
        if: steps.detect.outputs.type == 'python'
      - run: flake8 . || black --check . || echo "Lint check skipped (not configured)"
        if: steps.detect.outputs.type == 'python'
      - run: pytest || echo "Tests skipped (not configured)"
        if: steps.detect.outputs.type == 'python'

      # Go
      - uses: actions/setup-go@v4
        if: steps.detect.outputs.type == 'go'
        with:
          go-version: "1.21"
      - run: go fmt ./...
        if: steps.detect.outputs.type == 'go'
      - run: go test ./...
        if: steps.detect.outputs.type == 'go'

  security-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check for secrets
        run: |
          echo "Scanning for hardcoded secrets..."
          ! grep -r "api_key\|password\|secret\|AWS_\|AZURE_\|GITHUB_TOKEN" . --include="*.js" --include="*.ts" --include="*.py" --include="*.go" --include="*.java" || exit 1
          echo "✓ No hardcoded secrets detected"
