<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="The Calder Hearth — family recipes, gatherings, and stories kept by the fire."
    />
    <title>The Calder Hearth</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath fill='%23c45c26' d='M32 6c2 8 14 14 14 28a14 14 0 1 1-28 0C18 20 30 14 32 6z'/%3E%3C/svg%3E"
    />
  </head>
  <body>
    <!-- Static twin of the React RSVP form so Netlify can detect it at deploy. -->
    <form name="family-rsvp" method="POST" data-netlify="true" data-netlify-honeypot="bot-field" hidden>
      <input type="hidden" name="form-name" value="family-rsvp" />
      <input name="bot-field" />
      <input name="name" />
      <input name="email" />
      <input name="guests" />
      <textarea name="note"></textarea>
    </form>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
