name: Parallel CI/CD Pipeline

on:
  pull_request:
  push:
    branches: [main]

jobs:
  matrix-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x, 20.x]
      fail-fast: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm test
      - run: npm run build

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x .github/automations/ci.sh
      - run: .github/automations/ci.sh

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: npm audit --audit-level=moderate
      - run: |
          if git diff origin/main | grep -E '(password|token|api[_-]?key)' -i; then
            echo "Potential secrets found"
            exit 1
          fi

  coverage:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm test -- --coverage
      - uses: codecov/codecov-action@v3
        with:
          fail_ci_if_error: true

  deploy-staging:
    runs-on: ubuntu-latest
    needs: [matrix-test, lint, security]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - run: chmod +x .github/automations/deploy.sh
      - run: .github/automations/deploy.sh staging
